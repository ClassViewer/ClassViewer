name: Gradle Check
on:
  push:
  pull_request:
jobs:
  gradle-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'
          java-package: 'jdk+fx'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Get short SHA
        run: echo "GITHUB_ACTION_SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build
        run: ./gradlew jar --info --no-daemon --stacktrace
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassViewer-${{ env.GITHUB_ACTION_SHORT_SHA }}
          path: build/libs/ClassViewer-${{ env.GITHUB_ACTION_SHORT_SHA }}.jar
          compression-level: 0
